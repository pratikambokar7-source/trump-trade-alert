name: Trump Trade Alert (Off Hours)

# Every 2 hours outside the US market session.
# Weekdays: skip the 13:00-20:00 UTC market window (covered by market-hours.yml).
# Weekends: every 2 hours, all day.
on:
  schedule:
    - cron: "0 0,2,4,6,8,10,12,22 * * 1-5"
    - cron: "0 */2 * * 6,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trump-trade-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run Trump Trade Alert (120 min window)
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TIME_WINDOW: "120"
        run: node trump-trade-alert.js
      - name: Persist de-dup state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: update seen.json [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
